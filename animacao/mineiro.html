<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mineiro Cutout</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ---------------------------------------------------------------------------
// "O Mineiro": 5 s em estilo cutout. A personagem é o desenho original,
// cortado em peças (tools/cortar_mineiro.py) e animado como fantoche:
// peças rígidas que rodam em pivots, poses a cada 2 frames, sem easing.
// Por código só se desenham as peças de troca: pupilas, pálpebras e bocas.
// ---------------------------------------------------------------------------
const W = 1920, H = 1080, FPS = 24, DURATION = 5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2, D2R = Math.PI / 180;

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const between = (t, a, b) => t >= a - 1e-6 && t < b - 1e-6;
const POSE = 2 / FPS;
const twos = t => Math.floor(t / POSE + 1e-6) * POSE;
const poseIdx = (t, start) => Math.floor((t - start) / POSE + 1e-6);

// ------------------------------ TEXTURA DE PAPEL ---------------------------
const TEX = (() => {
  const S = 512, cnv = document.createElement('canvas'); cnv.width = cnv.height = S;
  const c = cnv.getContext('2d'), r = rng(42);
  const small = document.createElement('canvas'); small.width = small.height = 16;
  const sc = small.getContext('2d'), sd = sc.createImageData(16, 16);
  for (let i = 0; i < sd.data.length; i += 4) { const v = 238 + r() * 17; sd.data[i] = sd.data[i + 1] = sd.data[i + 2] = v; sd.data[i + 3] = 255; }
  sc.putImageData(sd, 0, 0);
  const big = document.createElement('canvas'); big.width = big.height = 48;
  const bc = big.getContext('2d');
  for (let x = 0; x < 3; x++) for (let y = 0; y < 3; y++) bc.drawImage(small, x * 16, y * 16);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(big, 16, 16, 16, 16, 0, 0, S, S);
  const img = c.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.1; }
  c.putImageData(img, 0, 0);
  c.lineWidth = 1;
  for (let i = 0; i < 240; i++) {
    const x = r() * S, y = r() * S, a = r() * TAU, l = 5 + r() * 16;
    c.strokeStyle = r() < 0.5 ? 'rgba(150,140,125,0.13)' : 'rgba(255,255,255,0.25)';
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      c.beginPath(); c.moveTo(x + ox, y + oy); c.lineTo(x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); c.stroke();
    }
  }
  return ctx.createPattern(cnv, 'repeat');
})();
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) % 512; }

const OUT = '#1b1715';
let CAM_S = 1;
function piece(c, fill, build, opt = {}) {
  const lw = opt.lw ?? 3, shadow = opt.shadow ?? true, tex = opt.tex ?? true;
  c.beginPath(); build(c);
  if (fill) {
    if (shadow) { c.shadowColor = 'rgba(20,10,0,0.30)'; c.shadowOffsetX = c.shadowOffsetY = 2 * CAM_S; c.shadowBlur = 1.5 * CAM_S; }
    c.fillStyle = fill; c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = c.shadowOffsetX = c.shadowOffsetY = 0;
    if (tex) {
      c.save(); c.globalCompositeOperation = 'multiply';
      const o = hash(fill); TEX.setTransform(new DOMMatrix().translate(o, o * 1.7 % 512));
      c.fillStyle = TEX; c.fill(); c.restore();
    }
  }
  if (lw) { c.lineWidth = lw; c.strokeStyle = OUT; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
}
const flat = (c, fill, build) => piece(c, fill, build, { lw: 0, shadow: false });
const ell = (x, y, rx, ry, r = 0) => c => c.ellipse(x, y, rx, ry, r, 0, TAU);
const poly = pts => c => { pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
const line = (c, pts, lw = 3, col = OUT) => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.lineWidth = lw; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); };
function soot(c, x, y, r, seed, a = 0.25) {
  const R = rng(seed), n = 11, pts = [];
  for (let i = 0; i < n; i++) { const ang = i / n * TAU, rr = r * (0.55 + R() * 0.55); pts.push([x + Math.cos(ang) * rr, y + Math.sin(ang) * rr * 0.8]); }
  c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(62,58,56,${a})`; c.beginPath(); poly(pts)(c); c.fill(); c.restore();
}

// --------------------------------- CENÁRIO ---------------------------------
const mk = () => { const k = document.createElement('canvas'); k.width = W; k.height = H; return k; };
const FAR = mk(), MID = mk(), NEAR = mk();

function cloud(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  flat(c, '#fbfcfe', c => {
    [[0, 0, 46], [52, -22, 54], [108, -6, 44], [150, 8, 30], [-40, 10, 30]].forEach(([cx, cy, r]) => { c.moveTo(cx + r, cy); c.arc(cx, cy, r, 0, TAU); });
    c.roundRect(-62, 0, 238, 40, 20);
  });
  c.restore();
}
function range(c, pts, color, cap, capBelow, seed) {
  flat(c, color, poly(pts));
  const r = rng(seed);
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i], L = pts[i - 1], R = pts[i + 1];
    if (!(py < L[1] && py < R[1]) || py > capBelow) continue;
    const f = 0.32 + r() * 0.12;
    const lx = lerp(px, L[0], f), ly = lerp(py, L[1], f);
    const rx = lerp(px, R[0], f * (0.8 + r() * 0.4)), ry = lerp(py, R[1], f * (0.8 + r() * 0.4));
    const edge = [], n = 4 + Math.floor(r() * 3);
    for (let k = 1; k < n; k++) edge.push([lerp(rx, lx, k / n) + (r() - 0.5) * 10, lerp(ry, ly, k / n) + (k % 2 ? -14 - r() * 22 : r() * 10)]);
    flat(c, cap, poly([[px, py], [rx, ry], ...edge, [lx, ly]]));
  }
}
function pine(c, x, y, s, col) {
  c.save(); c.translate(x, y); c.scale(s, s);
  flat(c, '#5d3f27', c => c.rect(-9, -36, 18, 38));
  const L = [[-88, -28], [-46, -78], [-70, -80], [-34, -132], [-54, -134], [-22, -182], [-36, -185], [0, -262]];
  const Rt = L.slice(0, -1).reverse().map(([px, py], i) => [-px + (i % 2 ? 4 : -3), py + (i % 2 ? -3 : 2)]);
  flat(c, col, poly([...L, ...Rt]));
  [[-88, -28, 22], [-70, -80, 18], [-54, -134, 14], [-36, -185, 11]].forEach(([px, py, w]) =>
    flat(c, '#f3f7fb', poly([[px - 2, py + 1], [px + w, py - 8], [px + w * 1.6, py - 4], [px + w * 0.6, py + 2]])));
  flat(c, '#f3f7fb', poly([[0, -262], [12, -236], [2, -240], [-10, -232]]));
  c.restore();
}

const RAIL_Y = 912, PILE_X = 760, CART_X = 360;

function buildBackground() {
  let c = FAR.getContext('2d');
  flat(c, '#79b5e4', c => c.rect(0, 0, W, H));
  cloud(c, 820, 120, 0.9); cloud(c, 1560, 170, 1.0); cloud(c, 260, 90, 0.7);
  range(c, [[-60, 700], [-60, 330], [60, 330], [150, 380], [240, 245], [330, 340], [420, 300], [560, 420], [700, 228], [790, 292], [880, 262], [1010, 400], [1150, 280], [1230, 330], [1335, 206], [1460, 360], [1570, 300], [1700, 392], [1820, 248], [1990, 330], [1990, 700]],
    '#a1b1c9', '#eef3f8', 330, 5);
  range(c, [[-60, 720], [-60, 470], [0, 468], [130, 386], [200, 430], [330, 356], [470, 480], [600, 418], [720, 500], [860, 376], [940, 420], [1060, 348], [1200, 470], [1300, 440], [1420, 386], [1520, 460], [1640, 366], [1760, 440], [1900, 398], [1990, 450], [1990, 720]],
    '#8092b0', '#f1f5f9', 400, 9);

  c = MID.getContext('2d');
  flat(c, '#e2eaf3', c => { c.moveTo(-60, 600); c.quadraticCurveTo(500, 540, 900, 580); c.quadraticCurveTo(1400, 620, 1990, 560); c.lineTo(1990, H + 60); c.lineTo(-60, H + 60); c.closePath(); });
  [[1180, 600, 0.55, '#3c6a49'], [1500, 590, 0.6, '#3c6a49'], [1860, 585, 0.62, '#3c6a49'], [1640, 620, 0.75, '#2d5b39']].forEach(a => pine(c, ...a));
  flat(c, '#7a726b', poly([[-60, 720], [-60, 400], [70, 360], [190, 392], [320, 340], [450, 402], [560, 446], [650, 520], [730, 610], [790, 720]]));
  [[60, 480, 70, 22], [380, 450, 60, 18], [560, 560, 50, 16], [140, 620, 80, 20], [620, 650, 40, 14]].forEach(([x, y, rx, ry]) => flat(c, '#665f59', ell(x, y, rx, ry)));
  flat(c, '#f1f5f9', poly([[-60, 400], [70, 360], [190, 392], [320, 340], [450, 402], [560, 446], [610, 486], [560, 470], [520, 452], [470, 438], [420, 420], [370, 404], [320, 378], [270, 398], [220, 410], [170, 404], [110, 392], [60, 388], [0, 412], [-60, 424]]));
  flat(c, '#141110', c => c.rect(232, 560, 196, 150));
  flat(c, '#2a2320', c => c.rect(232, 560, 196, 26));
  flat(c, '#7b5634', c => { c.rect(214, 552, 24, 160); c.rect(422, 552, 24, 160); });
  flat(c, '#6a4a2c', c => c.rect(200, 534, 260, 30));
  flat(c, '#a07a4c', c => c.rect(268, 488, 124, 44));
  c.fillStyle = '#2b1f16'; c.font = '900 30px Inter, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('MINA', 330, 511);
  flat(c, '#2b2622', c => c.rect(450, 566, 4, 18));
  flat(c, '#f3c64e', c => c.roundRect(440, 584, 24, 30, 6));
  flat(c, '#2b2622', c => { c.rect(438, 580, 28, 6); c.rect(438, 612, 28, 5); });

  c = NEAR.getContext('2d');
  flat(c, '#c8d5e2', c => { c.moveTo(-60, 700); c.quadraticCurveTo(600, 690, 1100, 702); c.quadraticCurveTo(1500, 712, 1990, 696); c.lineTo(1990, H + 200); c.lineTo(-60, H + 200); c.closePath(); });
  flat(c, '#eef3f8', c => { c.moveTo(-60, 708); c.quadraticCurveTo(600, 698, 1100, 710); c.quadraticCurveTo(1500, 720, 1990, 704); c.lineTo(1990, H + 200); c.lineTo(-60, H + 200); c.closePath(); });
  flat(c, '#d3d7dc', c => c.roundRect(-60, 858, W + 120, 74, 30));
  flat(c, '#c2c6cc', ell(PILE_X, 962, 230, 40));
  for (let x = -30; x < W + 40; x += 64) flat(c, '#6a4b2f', c => c.rect(x, 870, 26, 50));
  flat(c, '#5d636b', c => { c.rect(-60, 880, W + 120, 8); c.rect(-60, 908, W + 120, 9); });
  flat(c, '#9aa1a9', c => { c.rect(-60, 878, W + 120, 4); c.rect(-60, 906, W + 120, 4); });
  // pilha de carvão
  const px = PILE_X;
  piece(c, '#232226', poly([[px - 170, 985], [px - 130, 925], [px - 90, 905], [px - 50, 872], [px, 862], [px + 50, 876], [px + 95, 908], [px + 140, 935], [px + 180, 985]]), { lw: 3 });
  const r = rng(77);
  for (let i = 0; i < 28; i++) {
    const x = px - 140 + r() * 290, y = 905 + r() * 70 - Math.max(0, 40 - Math.abs(x - px) * 0.3), s = 9 + r() * 10;
    flat(c, i % 3 ? '#34333a' : '#46454d', poly([[x - s, y], [x - s * 0.3, y - s * 0.8], [x + s * 0.8, y - s * 0.5], [x + s, y + s * 0.3], [x, y + s * 0.6]]));
  }
  flat(c, '#d6e1ec', ell(1800, 1060, 230, 64)); flat(c, '#f6f9fc', ell(1800, 1052, 222, 56));
}

const FLAKES = (() => {
  const r = rng(3), L = [[24, 2.2, 34, 0.75], [16, 3.6, 58, 0.9], [7, 6, 96, 1]];
  const out = [];
  L.forEach(([n, s, v, a], layer) => { for (let i = 0; i < n; i++) out.push({ x: r() * W, y: r() * H, s: s * (0.8 + r() * 0.4), v, a, w: r() * TAU, front: layer === 2 }); });
  return out;
})();
function snow(c, t, front) {
  const q = twos(t);
  for (const f of FLAKES) {
    if (f.front !== front) continue;
    c.globalAlpha = f.a; c.fillStyle = '#f5f8fb';
    const y = ((f.y + f.v * q) % (H + 20)) - 10, x = f.x + Math.sin(q * 1.2 + f.w) * 14;
    c.beginPath(); c.arc(x, y, f.s, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
}

// -------------------------------- VAGONETA ---------------------------------
const COAL = '#1f1e22', COAL_HI = '#3b3a41';
function drawCart(c, x, full, roll) {
  c.save(); c.translate(x, RAIL_Y);
  c.save(); c.filter = `blur(${3 * CAM_S}px)`; c.fillStyle = 'rgba(60,70,90,0.22)'; c.beginPath(); c.ellipse(0, 2, 120, 10, 0, 0, TAU); c.fill(); c.restore();
  const r = rng(full ? 9 : 8), top = full ? -214 : -168;
  piece(c, COAL, c => { c.moveTo(-108, -150); c.quadraticCurveTo(-60, top - 10, 0, top); c.quadraticCurveTo(60, top - 6, 108, -150); c.closePath(); }, { lw: 2.5 });
  for (let i = 0; i < (full ? 14 : 8); i++) {
    const px = -90 + r() * 180, py = -152 - r() * (full ? 52 : 14), s = 9 + r() * 8;
    flat(c, i % 2 ? COAL_HI : '#2b2a30', poly([[px - s, py], [px - s * 0.2, py - s * 0.9], [px + s, py - s * 0.3], [px + s * 0.5, py + s * 0.6]]));
  }
  piece(c, '#6c625b', poly([[-118, -152], [118, -152], [98, -40], [-98, -40]]));
  piece(c, '#4f4742', c => c.roundRect(-124, -162, 248, 20, 4));
  piece(c, '#4f4742', c => c.rect(-100, -60, 200, 14), { lw: 2.5 });
  c.fillStyle = '#3a3330'; [-80, -40, 0, 40, 80].forEach(px => { c.beginPath(); c.arc(px, -132, 4, 0, TAU); c.fill(); });
  soot(c, -40, -100, 30, 71);
  for (const wx of [-60, 60]) {
    piece(c, '#2c2b2e', ell(wx, -24, 28, 28));
    piece(c, '#8a8f96', ell(wx, -24, 9, 9), { lw: 2 });
    const a = roll / 28 + (wx > 0 ? 1 : 0);
    line(c, [[wx + Math.cos(a) * 10, -24 + Math.sin(a) * 10], [wx + Math.cos(a) * 24, -24 + Math.sin(a) * 24]], 3, '#8a8f96');
  }
  c.restore();
}

// ------------------------------ FANTOCHE MINEIRO ---------------------------
// Coordenadas = píxeis do desenho recortado (580x735). Âncora: centro dos pés.
const IMG = {};
const ANCHOR = [345, 728], KS = 0.82;
const LINE = '#2b2725';
// valores de mineiro/rig.json (embutidos porque file:// não permite fetch)
const RIG = {"eyes": [{"cx": 336.26, "cy": 219.87, "rx": 29.0, "ry": 34.5, "px": 336.38, "py": 214.46, "pr": 6.93},
  {"cx": 449.40, "cy": 209.73, "rx": 26.5, "ry": 33.0, "px": 448.04, "py": 205.64, "pr": 6.41}],
  "skin": [219, 180, 149], "mouth": {"cx": 401.5, "cy": 299.6},
  "pivots": {"neck": [358, 382], "shoulders": [360, 440], "hipL": [287, 606], "hipR": [398, 606], "waist": [345, 600]}};

function loadAssets() {
  const names = ['head', 'torso', 'legL', 'legR', 'arms', 'arms_empty', 'mouth_closed'];
  return Promise.all(names.map(n => new Promise((ok, err) => {
    const im = new Image(); im.onload = () => { IMG[n] = im; ok(); }; im.onerror = err; im.src = `mineiro/${n}.png`;
  })));
}

function shadowOn(c) { c.shadowColor = 'rgba(20,10,0,0.28)'; c.shadowOffsetX = c.shadowOffsetY = 2 * CAM_S; c.shadowBlur = 2 * CAM_S; }
function shadowOff(c) { c.shadowColor = 'transparent'; c.shadowBlur = c.shadowOffsetX = c.shadowOffsetY = 0; }
function rotAbout(c, [px, py], deg) { c.translate(px, py); c.rotate(deg * D2R); c.translate(-px, -py); }
function drawPiece(c, im, pivot, deg) { c.save(); if (deg) rotAbout(c, pivot, deg); shadowOn(c); c.drawImage(im, 0, 0); shadowOff(c); c.restore(); }

// Bocas de troca, no estilo do traço original (a fechada é a original)
function mouth(c, shape, mood) {
  const { cx, cy } = RIG.mouth;
  if (shape === 'closed') {
    if (mood === 'frown') { c.save(); c.translate(0, cy * 2 + 4); c.scale(1, -1); c.drawImage(IMG.mouth_closed, 0, 0); c.restore(); }
    else c.drawImage(IMG.mouth_closed, 0, 0);
    return;
  }
  const dark = '#3b1714';
  const open = (w, d, teeth, tongue) => {
    const path = c => { c.moveTo(cx - w, cy - 3); c.quadraticCurveTo(cx, cy - 7, cx + w, cy - 4); c.bezierCurveTo(cx + w, cy + d * 1.3, cx - w, cy + d * 1.3, cx - w, cy - 3); c.closePath(); };
    c.beginPath(); path(c); c.fillStyle = dark; c.fill();
    c.save(); c.beginPath(); path(c); c.clip();
    if (teeth) { c.fillStyle = '#ece4d3'; c.fillRect(cx - w, cy - 8, w * 2, teeth + 5); }
    if (tongue) { c.fillStyle = '#b4504a'; c.beginPath(); c.ellipse(cx + 3, cy + d, w * 0.55, d * 0.35, 0, 0, TAU); c.fill(); }
    c.restore();
    c.beginPath(); path(c); c.lineWidth = 3.4; c.strokeStyle = LINE; c.lineJoin = 'round'; c.stroke();
  };
  const dot = (rx, ry) => { c.beginPath(); c.ellipse(cx, cy + 2, rx, ry, 0, 0, TAU); c.fillStyle = dark; c.fill(); c.lineWidth = 3; c.strokeStyle = LINE; c.stroke(); };
  switch (shape) {
    case 'small': dot(8, 6); break;
    case 'oo': dot(8, 10); break;
    case 'mid': open(18, 15, 4, false); break;
    case 'ee': open(22, 9, 6, false); break;
    case 'wide': open(22, 26, 6, true); break;
  }
}

function face(c, st) {
  const skin = `rgb(${RIG.skin.join(',')})`;
  RIG.eyes.forEach(e => {
    if (st.eyes === 'closed') {
      // pálpebra cor de pele por cima do branco do olho (peça de troca)
      c.save(); c.beginPath(); c.ellipse(e.cx, e.cy, e.rx + 0.5, e.ry + 0.5, 0, 0, TAU); c.clip();
      c.fillStyle = skin; c.fillRect(e.cx - e.rx, e.cy - e.ry, e.rx * 2, e.ry * 2);
      c.globalCompositeOperation = 'multiply'; TEX.setTransform(new DOMMatrix()); c.fillStyle = TEX; c.fillRect(e.cx - e.rx, e.cy - e.ry, e.rx * 2, e.ry * 2);
      c.restore();
      c.beginPath(); c.moveTo(e.cx - e.rx + 6, e.cy + 8); c.quadraticCurveTo(e.cx, e.cy + 16, e.cx + e.rx - 6, e.cy + 8);
      c.lineWidth = 3; c.strokeStyle = LINE; c.lineCap = 'round'; c.stroke();
      return;
    }
    const kx = e.rx - e.pr - 7, ky = e.ry - e.pr - 8;
    const px = clamp((e.px - e.cx) + st.look[0] * kx, -kx, kx), py = clamp((e.py - e.cy) + st.look[1] * ky, -ky, ky);
    c.beginPath(); c.arc(e.cx + px, e.cy + py, st.wide ? e.pr * 0.75 : e.pr, 0, TAU); c.fillStyle = '#1d1b1a'; c.fill();
  });
  mouth(c, st.mouth, st.mood);
}

// Matrizes do fantoche (as mesmas servem para desenhar e para saber onde está a lâmina)
const puppetMatrix = st => new DOMMatrix().translate(st.x, st.y + st.hop).scale(KS).translate(-ANCHOR[0], -ANCHOR[1]);
const rotM = (m, [px, py], d) => m.translate(px, py).rotate(d).translate(-px, -py);
const armsMatrix = st => rotM(rotM(puppetMatrix(st), RIG.pivots.waist, st.lean), RIG.pivots.shoulders, st.arms);

function drawMiner(c, st) {
  const P = RIG.pivots;
  c.save();
  c.save(); c.filter = `blur(${3 * CAM_S}px)`; c.fillStyle = 'rgba(60,70,90,0.24)';
  c.beginPath(); c.ellipse(st.x, st.y + 4, 128, 15, 0, 0, TAU); c.fill(); c.restore();
  c.setTransform(c.getTransform().multiply(puppetMatrix(st)));
  drawPiece(c, IMG.legL, P.hipL, st.legL);
  drawPiece(c, IMG.legR, P.hipR, st.legR);
  c.save(); rotAbout(c, P.waist, st.lean);
  drawPiece(c, IMG.torso, P.waist, 0);
  c.save(); rotAbout(c, P.neck, st.head);
  drawPiece(c, IMG.head, P.neck, 0);
  face(c, st);
  c.restore();
  drawPiece(c, st.loaded ? IMG.arms : IMG.arms_empty, P.shoulders, st.arms);
  c.restore();
  c.restore();
}

// -------------------------------- TIMELINE ---------------------------------
const GROUND = 975, MINER_X = 1000;
const T_STOP = 1.33, T_SHOT2 = 2.5, T_TALK1 = 2.75, T_SHOT3 = 3.83, T_ROLL = 3.92, T_TALK2 = 4.58;
const T_TOSS = 1.92, T_LAND = 2.25;
const SHEET_1 = ['mid', 'ee', 'small', 'oo', 'closed', 'ee', 'wide', 'closed', 'mid', 'wide', 'ee', 'wide', 'closed']; // "Mais um dia na mina..."
const SHEET_2 = ['wide', 'wide', 'closed', 'oo', 'mid', 'closed'];                                                      // "Ah, bolas."
// pá: [início, rotação dos braços, inclinação do corpo, carregada]
const ACTION = [[0, 0, 0, true], [1.5, -2, 1, true], [1.58, -4, 2, true], [1.83, 2, -1, true], [T_TOSS, 7, -3, false], [2.33, 2, -1, false], [2.42, 0, 0, false]];

function minerState(t) {
  const q = twos(t);
  const p = clamp(q / T_STOP, 0, 1);
  const st = { x: lerp(-300, MINER_X, p), y: GROUND, hop: 0, legL: 0, legR: 0, lean: 0, arms: 0, head: 0,
    loaded: true, look: [0, 0], eyes: 'open', wide: false, mouth: 'closed', mood: 'neutral' };
  if (p > 0 && p < 1) {                         // andar: pernas alternam, salto na pose de impulso
    const i = poseIdx(q, 0), ph = i % 3, s = Math.floor(i / 3) % 2 ? 1 : -1;
    st.legL = ph === 1 ? 0 : s * (ph === 0 ? 5 : 9); st.legR = -st.legL;
    st.hop = ph === 1 ? -12 : 0;
  }
  for (const [t0, arms, lean, loaded] of ACTION) if (q >= t0) { st.arms = arms; st.lean = lean; st.loaded = loaded; }
  if (between(q, 1.5, 1.83)) st.look = [-0.8, 0.7];      // olha para a pilha
  if (between(q, 1.83, 2.42)) st.look = [-1, -0.2];      // segue o carvão até à vagoneta
  if (between(q, T_SHOT2 + POSE, T_TALK1)) st.eyes = 'closed';   // pestaneja antes de falar
  if (between(q, T_TALK1, T_TALK1 + SHEET_1.length * POSE)) st.mouth = SHEET_1[poseIdx(q, T_TALK1)];
  if (q >= 4.0) st.look = [-1, 0];                       // os olhos apanham a vagoneta...
  if (q >= 4.08) st.head = -3;                           // ...e a cabeça vai atrás
  if (q >= 4.25) { st.wide = true; st.mood = 'frown'; }
  if (between(q, 4.25, 4.42)) st.mouth = 'small';
  if (between(q, 4.42, T_TALK2)) st.eyes = 'closed';
  if (q >= T_TALK2) st.mouth = SHEET_2[Math.min(poseIdx(q, T_TALK2), SHEET_2.length - 1)];
  return st;
}

function cartX(t) {
  const q = twos(t);
  if (q < T_ROLL) return CART_X;
  const d = q - T_ROLL;
  return CART_X - 50 * d - 0.5 * 1500 * d * d;
}

function coalFlight(c, t) {
  const q = twos(t);
  const i = poseIdx(q, T_TOSS), n = poseIdx(T_LAND, T_TOSS);
  if (i >= 0 && i < n) {
    const b = armsMatrix(minerState(T_TOSS)).transformPoint(new DOMPoint(95, 625));
    const r = rng(19), p = (i + 1) / (n + 1);
    for (let k = 0; k < 7; k++) {
      const tx = CART_X - 60 + r() * 120, ty = RAIL_Y - 190 + r() * 20;
      const x = lerp(b.x, tx, p) + (r() - 0.5) * 34, y = lerp(b.y, ty, p) - Math.sin(p * Math.PI) * 170 + (r() - 0.5) * 26, s = 10 + r() * 7;
      piece(c, k % 2 ? COAL : COAL_HI, poly([[x - s, y], [x - s * 0.2, y - s], [x + s, y - s * 0.4], [x + s * 0.7, y + s * 0.7], [x - s * 0.4, y + s * 0.8]]), { lw: 2 });
    }
  }
  const j = poseIdx(q, T_LAND);
  if (j === 0 || j === 1) {
    const Rr = rng(23), cx = CART_X, cy = RAIL_Y - 215, k = j === 0 ? 1 : 1.5;
    c.save(); c.globalAlpha = j === 0 ? 0.9 : 0.6;
    flat(c, '#4b4848', c => { for (let m = 0; m < 6; m++) { const a = m / 6 * Math.PI - Math.PI, rr = (26 + Rr() * 14) * k; const px = cx + Math.cos(a) * 60 * k, py = cy + Math.sin(a) * 26 * k; c.moveTo(px + rr, py); c.arc(px, py, rr, 0, TAU); } });
    c.restore();
  }
}

// --------------------------------- CÂMARA ----------------------------------
function camera(t) {
  if (between(t, T_SHOT2, T_SHOT3)) return { s: 1.75, fx: MINER_X + 40, fy: GROUND - 356 };
  return { s: 1, fx: W / 2, fy: H / 2 };
}
function applyCam(c, cam, depth) {
  const s = 1 + (cam.s - 1) * depth;
  c.setTransform(s, 0, 0, s, W / 2 - cam.fx * s, H / 2 - cam.fy * s);
}
function caption(c, t) {
  let text = null;
  if (between(t, T_TALK1, T_SHOT3)) text = 'Mais um dia na mina...';
  else if (t >= T_TALK2) text = '...Ah, bolas.';
  if (!text) return;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.font = '700 46px Inter, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.letterSpacing = '0.5px'; c.wordSpacing = '8px';
  c.lineJoin = 'round'; c.lineWidth = 7; c.strokeStyle = '#000'; c.strokeText(text, W / 2, 1032);
  c.fillStyle = '#fff'; c.fillText(text, W / 2, 1032);
}

function renderFrame(t) {
  const cam = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#79b5e4'; ctx.fillRect(0, 0, W, H);
  applyCam(ctx, cam, 0.5); ctx.drawImage(FAR, 0, 0);
  applyCam(ctx, cam, 0.75); ctx.drawImage(MID, 0, 0);
  applyCam(ctx, cam, 1); ctx.drawImage(NEAR, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0); snow(ctx, t, false);
  applyCam(ctx, cam, 1); CAM_S = cam.s;
  const cx = cartX(t);
  drawCart(ctx, cx, twos(t) >= T_LAND, CART_X - cx);
  ctx.imageSmoothingQuality = 'high';
  drawMiner(ctx, minerState(t));
  applyCam(ctx, cam, 1);
  coalFlight(ctx, t);
  CAM_S = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); snow(ctx, t, true);
  caption(ctx, t);
}

buildBackground();
window.renderFrame = renderFrame;
loadAssets().then(() => {
  window.ready = true;
  if (!location.search.includes('render')) {
    const t0 = performance.now();
    (function loop(now) {
      renderFrame(Math.floor(((now - t0) / 1000) % DURATION * FPS) / FPS);
      requestAnimationFrame(loop);
    })(t0);
  }
});
</script>
