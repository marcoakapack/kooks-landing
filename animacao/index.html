<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animação Cutout</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ---------------------------------------------------------------------------
// Animação de 5 s em estilo "cutout" de papel, feita só com código.
//
// Regras do estilo (da pesquisa sobre a produção da série):
//  * 24 fps, personagens e adereços mudam de pose a cada 2 frames ("on twos"),
//    sem easing: cada mudança é uma troca seca de pose. Só a câmara é suave.
//  * Fantoches rígidos de peças planas: rodam em pivots, trocam de desenho,
//    nunca deformam. Pequena sombra entre camadas ("no-platen shadow").
//  * Pestanejar antes de falar; a cabeça vira antes do corpo.
//  * Quem ouve fica completamente parado (só pestaneja).
//  * Cenário sem contornos e sem sombras; textura de papel dentro de cada forma.
// ---------------------------------------------------------------------------
const W = 1920, H = 1080, FPS = 24, DURATION = 5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const OUT = '#1b1715';
const TAU = Math.PI * 2;

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const between = (t, a, b) => t >= a && t < b;
const POSE = 2 / FPS;                                  // uma pose = 2 frames
const twos = t => Math.floor(t / POSE + 1e-6) * POSE;  // tempo quantizado
const poseIdx = (t, start) => Math.floor((t - start) / POSE + 1e-6);

// ------------------------------ TEXTURA DE PAPEL ---------------------------
// Tile 512x512 sem costuras: grão fino + manchas suaves + fibras. Aplica-se
// em "multiply" dentro de cada forma, por isso "cola" a cada peça de papel.
const TEX = (() => {
  const S = 512, cnv = document.createElement('canvas'); cnv.width = cnv.height = S;
  const c = cnv.getContext('2d'), r = rng(42);
  // manchas de baixa frequência (periódicas)
  const small = document.createElement('canvas'); small.width = small.height = 16;
  const sc = small.getContext('2d'), sd = sc.createImageData(16, 16);
  for (let i = 0; i < sd.data.length; i += 4) { const v = 238 + r() * 17; sd.data[i] = sd.data[i + 1] = sd.data[i + 2] = v; sd.data[i + 3] = 255; }
  sc.putImageData(sd, 0, 0);
  const big = document.createElement('canvas'); big.width = big.height = 48;
  const bc = big.getContext('2d');
  for (let x = 0; x < 3; x++) for (let y = 0; y < 3; y++) bc.drawImage(small, x * 16, y * 16);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(big, 16, 16, 16, 16, 0, 0, S, S);
  // grão
  const img = c.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.1; }
  c.putImageData(img, 0, 0);
  // fibras (desenhadas com wrap para não haver costura)
  c.lineWidth = 1;
  for (let i = 0; i < 240; i++) {
    const x = r() * S, y = r() * S, a = r() * TAU, l = 5 + r() * 16;
    c.strokeStyle = r() < 0.5 ? 'rgba(150,140,125,0.13)' : 'rgba(255,255,255,0.25)';
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      c.beginPath(); c.moveTo(x + ox, y + oy); c.lineTo(x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); c.stroke();
    }
  }
  return ctx.createPattern(cnv, 'repeat');
})();
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) % 512; }

let CAM_S = 1; // escala da câmara (para a sombra entre camadas acompanhar)

// Peça de papel: cor lisa + textura + (opcional) sombra de camada + contorno
function piece(c, fill, build, opt = {}) {
  const lw = opt.lw ?? 3, shadow = opt.shadow ?? true, tex = opt.tex ?? true;
  c.beginPath(); build(c);
  if (fill) {
    if (shadow) {
      c.shadowColor = 'rgba(20,10,0,0.30)';
      c.shadowOffsetX = 2 * CAM_S; c.shadowOffsetY = 2 * CAM_S; c.shadowBlur = 1.5 * CAM_S;
    }
    c.fillStyle = fill; c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = c.shadowOffsetX = c.shadowOffsetY = 0;
    if (tex) {
      c.save(); c.globalCompositeOperation = 'multiply';
      const o = hash(fill);
      TEX.setTransform(new DOMMatrix().translate(o, o * 1.7 % 512));
      c.fillStyle = TEX; c.fill(); c.restore();
    }
  }
  if (lw) { c.lineWidth = lw; c.strokeStyle = OUT; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
}
// cenário: sem contorno, sem sombra
const flat = (c, fill, build) => piece(c, fill, build, { lw: 0, shadow: false });
const ell = (x, y, rx, ry, r = 0) => c => c.ellipse(x, y, rx, ry, r, 0, TAU);
const poly = pts => c => { pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };

// --------------------------------- CENÁRIO ---------------------------------
// Três planos para parallax: longe (céu, montanhas), meio (colinas, árvores,
// casas), perto (estrada, chão, placa).
const mk = () => { const k = document.createElement('canvas'); k.width = W; k.height = H; return k; };
const FAR = mk(), MID = mk(), NEAR = mk();

function cloud(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  flat(c, '#fbfcfe', c => {
    [[0, 0, 46], [52, -22, 54], [108, -6, 44], [150, 8, 30], [-40, 10, 30]].forEach(([cx, cy, r]) => { c.moveTo(cx + r, cy); c.arc(cx, cy, r, 0, TAU); });
    c.roundRect(-62, 0, 238, 40, 20);
  });
  c.restore();
}

function range(c, pts, color, cap, capBelow, seed) {
  flat(c, color, poly(pts));
  const r = rng(seed);
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i], L = pts[i - 1], R = pts[i + 1];
    if (!(py < L[1] && py < R[1]) || py > capBelow) continue;
    const f = 0.32 + r() * 0.12;
    const lx = lerp(px, L[0], f), ly = lerp(py, L[1], f);
    const rx = lerp(px, R[0], f * (0.8 + r() * 0.4)), ry = lerp(py, R[1], f * (0.8 + r() * 0.4));
    const edge = [];
    const n = 4 + Math.floor(r() * 3);
    for (let k = 1; k < n; k++) edge.push([lerp(rx, lx, k / n) + (r() - 0.5) * 10, lerp(ry, ly, k / n) + (k % 2 ? -14 - r() * 22 : r() * 10)]);
    flat(c, cap, poly([[px, py], [rx, ry], ...edge, [lx, ly]]));
  }
}

function pine(c, x, y, s, col) {
  c.save(); c.translate(x, y); c.scale(s, s);
  flat(c, '#5d3f27', c => c.rect(-9, -36, 18, 38));
  const L = [[-88, -28], [-46, -78], [-70, -80], [-34, -132], [-54, -134], [-22, -182], [-36, -185], [0, -262]];
  const Rt = L.slice(0, -1).reverse().map(([px, py], i) => [-px + (i % 2 ? 4 : -3), py + (i % 2 ? -3 : 2)]);
  flat(c, col, poly([...L, ...Rt]));
  // neve pousada nas pontas dos ramos
  [[-88, -28, 22], [-70, -80, 18], [-54, -134, 14], [-36, -185, 11]].forEach(([px, py, w]) =>
    flat(c, '#f3f7fb', poly([[px - 2, py + 1], [px + w, py - 8], [px + w * 1.6, py - 4], [px + w * 0.6, py + 2]])));
  flat(c, '#f3f7fb', poly([[0, -262], [12, -236], [2, -240], [-10, -232]]));
  c.restore();
}

function house(c, x, y, s, wall, roof) {
  c.save(); c.translate(x, y); c.scale(s, s);
  flat(c, '#6a6a6a', c => c.rect(48, -205, 26, 60));
  flat(c, wall, c => c.rect(-90, -112, 180, 112));
  flat(c, roof, poly([[-116, -104], [0, -196], [116, -104]]));
  flat(c, '#f3f7fb', poly([[-118, -104], [0, -198], [118, -104], [92, -112], [64, -110], [36, -126], [0, -150], [-30, -128], [-66, -116], [-96, -114]]));
  flat(c, '#3b2f2a', c => { c.rect(-64, -82, 42, 38); c.rect(22, -82, 42, 38); });
  flat(c, '#f2d36b', c => { c.rect(-60, -78, 34, 30); c.rect(26, -78, 34, 30); });
  flat(c, '#4f3423', c => c.rect(-17, -62, 34, 62));
  flat(c, '#f3f7fb', c => c.roundRect(-104, -8, 208, 14, 7));
  c.restore();
}

function buildBackground() {
  // ---- longe
  let c = FAR.getContext('2d');
  flat(c, '#79b5e4', c => c.rect(0, 0, W, H));
  cloud(c, 290, 140, 1.0); cloud(c, 1010, 92, 0.75); cloud(c, 1610, 175, 0.9);
  range(c, [[-60, 700], [-60, 330], [60, 330], [150, 380], [240, 245], [330, 340], [420, 300], [560, 420], [700, 228], [790, 292], [880, 262], [1010, 400], [1150, 280], [1230, 330], [1335, 206], [1460, 360], [1570, 300], [1700, 392], [1820, 248], [1990, 330], [1990, 700]],
    '#a1b1c9', '#eef3f8', 330, 5);
  range(c, [[-60, 720], [-60, 470], [0, 468], [130, 386], [200, 430], [330, 356], [470, 480], [600, 418], [720, 500], [860, 376], [940, 420], [1060, 348], [1200, 470], [1300, 440], [1420, 386], [1520, 460], [1640, 366], [1760, 440], [1900, 398], [1990, 450], [1990, 720]],
    '#8092b0', '#f1f5f9', 400, 9);

  // ---- meio
  c = MID.getContext('2d');
  flat(c, '#e2eaf3', c => { c.moveTo(-60, 600); c.quadraticCurveTo(300, 520, 700, 572); c.quadraticCurveTo(1100, 626, 1500, 556); c.quadraticCurveTo(1800, 518, 1990, 572); c.lineTo(1990, H + 60); c.lineTo(-60, H + 60); c.closePath(); });
  house(c, 330, 608, 0.55, '#5e86ad', '#3b3d52');
  [[60, 600, 0.62, '#3c6a49'], [610, 586, 0.5, '#3c6a49'], [1290, 600, 0.5, '#3c6a49'], [1850, 585, 0.6, '#3c6a49']].forEach(a => pine(c, ...a));
  flat(c, '#ebf1f7', c => { c.moveTo(-60, 640); c.quadraticCurveTo(400, 584, 900, 622); c.quadraticCurveTo(1400, 660, 1990, 606); c.lineTo(1990, H + 60); c.lineTo(-60, H + 60); c.closePath(); });
  house(c, 1530, 622, 0.62, '#b4523b', '#563628');
  [[150, 640, 0.8, '#2d5b39'], [230, 632, 0.62, '#2d5b39'], [540, 628, 0.72, '#2d5b39'], [1370, 640, 0.78, '#2d5b39'], [1745, 628, 0.85, '#2d5b39']].forEach(a => pine(c, ...a));

  // ---- perto
  c = NEAR.getContext('2d');
  flat(c, '#c8d5e2', c => c.rect(-60, 612, W + 120, 10));
  flat(c, '#6d6e74', c => c.rect(-60, 620, W + 120, 64));
  c.save(); for (let x = -40; x < W + 60; x += 150) flat(c, '#e6c34a', c => c.rect(x, 648, 74, 8)); c.restore();
  flat(c, '#c8d5e2', c => { c.moveTo(-60, 688); c.quadraticCurveTo(600, 676, 1100, 690); c.quadraticCurveTo(1500, 700, 1990, 684); c.lineTo(1990, H + 200); c.lineTo(-60, H + 200); c.closePath(); });
  flat(c, '#eef3f8', c => { c.moveTo(-60, 696); c.quadraticCurveTo(600, 684, 1100, 698); c.quadraticCurveTo(1500, 708, 1990, 692); c.lineTo(1990, H + 200); c.lineTo(-60, H + 200); c.closePath(); });
  // montes de neve à frente
  flat(c, '#d6e1ec', ell(1760, 1050, 230, 70)); flat(c, '#f6f9fc', ell(1760, 1040, 222, 62));
  flat(c, '#d6e1ec', ell(90, 1075, 260, 66)); flat(c, '#f6f9fc', ell(90, 1066, 250, 58));
  // placa da paragem (adereço junto às personagens: leva contorno)
  c.save(); c.filter = 'blur(3px)'; c.fillStyle = 'rgba(70,90,120,0.22)'; c.beginPath(); c.ellipse(1580, 930, 46, 10, 0, 0, TAU); c.fill(); c.restore();
  piece(c, '#8f979e', c => c.rect(1572, 560, 16, 370));
  piece(c, '#fbfbf8', c => c.rect(1500, 500, 160, 108));
  piece(c, null, c => c.rect(1512, 512, 136, 84), { lw: 7 });
  c.strokeStyle = '#c23a2c'; c.lineWidth = 6; c.strokeRect(1512, 512, 136, 84);
  c.fillStyle = '#c23a2c'; c.font = '900 46px Inter, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('BUS', 1580, 555);
}

// neve a cair: 3 profundidades, em espaço de ecrã, também "on twos"
const FLAKES = (() => {
  const r = rng(3), L = [[38, 2.2, 34, 0.75], [26, 3.6, 58, 0.9], [12, 6, 96, 1]];
  const out = [];
  L.forEach(([n, s, v, a], layer) => { for (let i = 0; i < n; i++) out.push({ x: r() * W, y: r() * H, s: s * (0.8 + r() * 0.4), v, a, w: r() * TAU, front: layer === 2 }); });
  return out;
})();
function snow(c, t, front) {
  const q = twos(t);
  for (const f of FLAKES) {
    if (f.front !== front) continue;
    c.globalAlpha = f.a; c.fillStyle = '#f5f8fb';
    const y = ((f.y + f.v * q) % (H + 20)) - 10, x = f.x + Math.sin(q * 1.2 + f.w) * 14;
    c.beginPath(); c.arc(x, y, f.s, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
}

// ------------------------------- PERSONAGENS -------------------------------
const KID_A = { skin: '#fcdcb6', jacket: '#24a093', hem: '#1a7c72', pants: '#3a4a8c', mitten: '#f2c22e',
  head: 'beanie', hat: '#7b3fa2', band: '#5c2b7c', pom: '#f2c22e' };
const KID_B = { skin: '#fcdcb6', jacket: '#e09f2a', hem: '#b77c16', pants: '#5a4535', mitten: '#d4382e',
  head: 'hair', hair: '#5a381b', scarf: '#d4382e' };

function arm(c, k, side, deg) {
  const sx = side * 64, sy = -140, len = 70, a = deg * Math.PI / 180;
  const hx = sx + Math.cos(a) * len * side, hy = sy + Math.sin(a) * len;
  c.save();
  c.shadowColor = 'rgba(20,10,0,0.30)'; c.shadowOffsetX = c.shadowOffsetY = 2 * CAM_S; c.shadowBlur = 1.5 * CAM_S;
  c.lineCap = 'round'; c.strokeStyle = OUT; c.lineWidth = 38;
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(hx, hy); c.stroke();
  c.restore();
  c.lineCap = 'round'; c.strokeStyle = k.jacket; c.lineWidth = 32;
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(hx, hy); c.stroke();
  piece(c, k.mitten, ell(hx + side * 3, hy - 13, 8, 10, -0.4 * side));
  piece(c, k.mitten, ell(hx, hy, 19, 18));
}

// Conjunto fixo de bocas (troca de peça, nunca deformação)
function mouth(c, shape, mx, mood) {
  const y = -224, dark = '#4a1513';
  const open = (w, d, teeth, tongue) => {
    const path = c => { c.moveTo(mx - w, y); c.lineTo(mx + w, y); c.bezierCurveTo(mx + w, y + d * 1.3, mx - w, y + d * 1.3, mx - w, y); c.closePath(); };
    piece(c, dark, path, { shadow: false, tex: false, lw: 0 });
    c.save(); c.beginPath(); path(c); c.clip();
    if (teeth) { c.fillStyle = '#fbf8f0'; c.fillRect(mx - w, y, w * 2, teeth); }
    if (tongue) { c.fillStyle = '#d95a58'; c.beginPath(); c.ellipse(mx + w * 0.15, y + d, w * 0.55, d * 0.35, 0, 0, TAU); c.fill(); }
    c.restore();
    piece(c, null, path, { lw: 3 });
  };
  switch (shape) {
    case 'small': piece(c, dark, ell(mx, y + 4, 13, 8), { shadow: false, tex: false }); break;
    case 'oo': piece(c, dark, ell(mx, y + 6, 12, 15), { shadow: false, tex: false }); break;
    case 'mid': open(24, 22, 6, false); break;
    case 'ee': open(30, 14, 8, false); break;
    case 'wide': open(32, 40, 8, true); break;
    default: {
      const curve = mood === 'smile' ? 10 : mood === 'frown' ? -9 : 1;
      c.beginPath(); c.moveTo(mx - 19, y); c.quadraticCurveTo(mx, y + curve, mx + 19, y);
      c.lineWidth = 3.5; c.strokeStyle = OUT; c.lineCap = 'round'; c.stroke();
    }
  }
}

function eyes(c, k, st, fx) {
  const e = st.eyes;
  for (const s of [-1, 1]) {
    const ex = fx + s * 33, ey = -298, rx = 36, ry = e.surprised ? 48 : 44;
    if (e.state === 'squeeze') {           // olhos fechados com força: > <
      c.lineWidth = 5; c.strokeStyle = OUT; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(ex + s * 20, ey - 15); c.lineTo(ex - s * 14, ey); c.lineTo(ex + s * 20, ey + 15); c.stroke();
      continue;
    }
    if (e.state === 'closed') {            // pálpebra cor de pele por cima do olho
      piece(c, k.skin, ell(ex, ey, rx, ry), { shadow: false });
      c.beginPath(); c.moveTo(ex - 26, ey + 10); c.quadraticCurveTo(ex, ey + 20, ex + 26, ey + 10);
      c.lineWidth = 3; c.strokeStyle = OUT; c.stroke();
      continue;
    }
    piece(c, '#ffffff', ell(ex, ey, rx, ry), { shadow: false, lw: 0 });
    const pr = e.surprised ? 4.5 : 6.2;
    c.fillStyle = OUT; c.beginPath(); c.arc(ex + e.look[0] * 15, ey + e.look[1] * 16, pr, 0, TAU); c.fill();
    if (e.angry) {                          // pálpebra zangada corta o topo do olho
      const outer = ex + s * rx, inner = ex - s * rx;
      c.save(); c.beginPath(); c.ellipse(ex, ey, rx, ry, 0, 0, TAU); c.clip();
      c.fillStyle = k.skin; c.beginPath(); c.moveTo(outer, ey - 60); c.lineTo(inner, ey - 60); c.lineTo(inner, ey - 8); c.lineTo(outer, ey - 34); c.closePath(); c.fill();
      c.restore();
    }
    piece(c, null, ell(ex, ey, rx, ry), { lw: 3 });
    if (e.angry) {
      c.lineWidth = 6; c.strokeStyle = OUT; c.lineCap = 'round';
      c.beginPath(); c.moveTo(ex + s * (rx + 4), ey - 38); c.lineTo(ex - s * (rx - 6), ey - 10); c.stroke();
    }
  }
}

function headwear(c, k, hf) {
  if (k.head === 'beanie') {
    piece(c, k.pom, ell(hf * 10, -420, 26, 24));
    c.save(); c.beginPath(); c.rect(-200, -500, 400, 162); c.clip();
    piece(c, k.hat, ell(0, -285, 142, 124));
    c.restore();
    piece(c, k.band, c => c.roundRect(-132, -364, 264, 28, 12));
  } else {
    const o = hf * 16;
    piece(c, k.hair, poly([[o - 30, -396], [o - 8, -440], [o + 8, -402], [o + 32, -432], [o + 40, -394]]));
    const th = Math.asin(35 / 123);
    piece(c, k.hair, c => {
      c.ellipse(0, -285, 141, 123, 0, Math.PI + th, TAU - th);
      [[110, -347], [84, -322], [55, -352], [25, -326], [-5, -354], [-35, -327], [-66, -350], [-95, -323], [-118, -343]]
        .forEach(([x, y]) => c.lineTo(x + o * 0.4, y));
      c.closePath();
    });
  }
}

function splat(c) {                        // neve colada na cabeça
  piece(c, '#f7fafc', poly([[18, -400], [44, -428], [70, -414], [96, -432], [118, -404], [134, -380], [112, -356], [118, -330], [96, -340], [90, -310], [78, -338], [52, -344], [30, -366]]));
}

function drawKid(c, k, st) {
  c.save();
  c.translate(st.x, st.y + st.hop);
  c.rotate(st.rot || 0);
  c.scale(KS, KS);
  // sombra de contacto (fica no chão quando salta)
  c.save(); c.filter = `blur(${3 * CAM_S}px)`; c.fillStyle = 'rgba(60,80,115,0.22)';
  c.beginPath(); c.ellipse(0, 6 - st.hop, 100, 13, 0, 0, TAU); c.fill(); c.restore();
  const bf = st.bodyFace * 16, hf = st.headFace;
  // pés: deslizam alternadamente, sem pernas
  piece(c, '#262222', ell(-40 + st.step, -8, 42, 14));
  piece(c, '#262222', ell(40 - st.step, -8, 42, 14));
  piece(c, k.pants, c => c.rect(-70, -48, 140, 36));
  c.beginPath(); c.moveTo(bf * 0.5, -44); c.lineTo(bf * 0.5, -12); c.lineWidth = 3; c.strokeStyle = OUT; c.stroke();
  arm(c, k, -1, st.armL); arm(c, k, 1, st.armR);
  piece(c, k.jacket, c => {
    c.moveTo(-64, -180); c.lineTo(64, -180);
    c.quadraticCurveTo(82, -114, 86, -46); c.lineTo(-86, -46);
    c.quadraticCurveTo(-82, -114, -64, -180); c.closePath();
  });
  piece(c, k.hem, c => c.roundRect(-88, -60, 176, 16, 6));
  c.beginPath(); c.moveTo(bf, -165); c.lineTo(bf, -62); c.lineWidth = 3; c.strokeStyle = OUT; c.stroke();
  c.fillStyle = OUT; [-140, -112, -84].forEach(y => { c.beginPath(); c.arc(bf - 13, y, 4, 0, TAU); c.fill(); });
  if (k.scarf) {
    piece(c, k.scarf, c => c.roundRect(-78, -186, 156, 30, 12));
    const sx = -st.bodyFace >= 0 ? 34 : -64; // a ponta do cachecol fica do lado de trás
    piece(c, k.scarf, poly([[sx, -164], [sx + 28, -164], [sx + 32, -98], [sx + 4, -102]]));
  }
  // cabeça (peça rígida, sem deformar); em 3/4 olhos e boca deslizam para o lado
  piece(c, k.skin, ell(0, -285, 138, 118));
  headwear(c, k, hf);
  const fx = hf * 24;
  eyes(c, k, st, fx);
  mouth(c, st.mouth, hf * 34, st.mood);
  if (st.splat) splat(c);
  c.restore();
}

// -------------------------------- TIMELINE ---------------------------------
// Folhas de exposição das bocas: uma entrada por pose (2 frames).
const SHEET_A = ['ee', 'ee', 'small', 'closed', 'oo', 'oo', 'ee', 'wide', 'wide', 'oo', 'mid', 'closed'];   // "Ei! Hoje não há aulas!"
const SHEET_B = ['wide', 'wide', 'ee', 'ee', 'small', 'oo', 'closed', 'closed', 'oo', 'oo', 'wide', 'mid', 'closed']; // "A sério?! Brutal!"
const SHEET_LAUGH = ['wide', 'wide', 'mid', 'small'];

const GROUND = 968, A_X = 750, B_X = 1185, KS = 1.15; // KS: escala das personagens
const T_A_TALK = 1.42, T_SHOT2 = 2.25, T_B_TALK = 2.42, T_SHOT3 = 3.58, T_THROW = 3.62, T_HIT = 3.96, T_LAUGH = 4.12, T_ANGRY = 4.46;

function walker(q, x0, x1, t0, t1, face) {
  // andar: 1 passo a cada 3 poses (6 frames = 4 passos/s); salto só na pose de impulso
  const p = clamp((q - t0) / (t1 - t0), 0, 1);
  const st = { x: lerp(x0, x1, p), hop: 0, step: 0, walking: p > 0 && p < 1 };
  if (st.walking) {
    const i = poseIdx(q, t0), ph = i % 3, foot = Math.floor(i / 3) % 2 ? 1 : -1;
    st.hop = ph === 1 ? -14 : 0;
    st.step = foot * face * (ph === 0 ? 10 : 20);
  }
  return st;
}

function stateA(t) {
  const q = twos(t);
  const w = walker(q, -200, A_X, 0, 1.08, 1);
  const st = { x: w.x, y: GROUND, hop: w.hop, step: w.step, rot: 0, headFace: 1, bodyFace: 1,
    armL: 76, armR: 76, mouth: 'closed', mood: 'smile', eyes: { state: 'open', look: [0.7, 0] } };
  if (between(q, 1.25, T_A_TALK)) st.eyes.state = 'closed';                 // pestaneja antes de falar
  if (between(q, T_A_TALK, T_A_TALK + SHEET_A.length * POSE)) st.mouth = SHEET_A[poseIdx(q, T_A_TALK)];
  if (q >= T_A_TALK + POSE * 2 && q < T_SHOT2) st.armR = q < T_A_TALK + POSE * 3 ? 30 : -12; // gesto: snap + hold
  if (q >= T_THROW + POSE * 2) st.eyes.look = [0.9, -0.5];                  // vê a bola
  if (q >= T_HIT) st.eyes.look = [0.8, 0.1];
  if (q >= T_LAUGH) {
    const i = poseIdx(q, T_LAUGH);
    st.headFace = 0;                                                         // cabeça vira primeiro...
    st.bodyFace = q >= T_LAUGH + POSE * 3 ? 0 : 1;                           // ...o corpo 3 poses depois
    st.mouth = SHEET_LAUGH[i % SHEET_LAUGH.length];
    st.hop = i % 4 === 0 ? -8 : 0;
    st.armL = st.armR = 116;                                                 // mãos na barriga
    st.rot = 0.04;
    st.eyes.look = [0.6, 0.15];
  }
  return st;
}

function stateB(t) {
  const q = twos(t);
  const w = walker(q, 2140, B_X, 0.12, 1.12, -1);
  const st = { x: w.x, y: GROUND, hop: w.hop, step: w.step, rot: 0, headFace: -1, bodyFace: -1,
    armL: 76, armR: 76, mouth: 'closed', mood: 'neutral', eyes: { state: 'open', look: [-0.7, 0] } };
  if (between(q, T_SHOT2, T_B_TALK)) st.eyes.state = 'closed';             // pestaneja antes de falar
  if (q >= T_B_TALK && q < T_HIT) {
    st.eyes.surprised = true; st.mood = 'smile';
    if (q < T_B_TALK + SHEET_B.length * POSE) st.mouth = SHEET_B[poseIdx(q, T_B_TALK)];
    const g = poseIdx(q, T_B_TALK + POSE * 3);
    if (g >= 0 && q < T_SHOT3) { st.armL = st.armR = g === 0 ? 20 : -38; } // braços no ar: snap + hold
  }
  if (q >= T_HIT && q < T_ANGRY) {                                          // desenho de reação ao impacto
    st.eyes = { state: 'squeeze', look: [0, 0] };
    st.mouth = 'wide'; st.splat = true;
    st.rot = -0.34; st.x += 18;                                             // roda rígido ~20°
    st.armL = st.armR = -30;
  }
  if (q >= T_ANGRY) {
    st.splat = true; st.mood = 'frown';
    st.headFace = 1;                                                         // cabeça vira para quem atirou...
    st.bodyFace = q >= T_ANGRY + POSE * 2 ? 1 : -1;                          // ...e o corpo vem depois
    st.eyes = { state: 'open', angry: true, look: [0.85, -0.05] };
  }
  return st;
}

function snowball(c, t) {
  const q = twos(t);
  if (q >= T_THROW && q < T_HIT) {
    const p = (q - T_THROW) / (T_HIT - T_THROW);
    const x = lerp(2020, B_X + 90, p), y = lerp(330, GROUND - 440, p) - Math.sin(p * Math.PI) * 90;
    c.strokeStyle = 'rgba(250,252,255,0.85)'; c.lineWidth = 5; c.lineCap = 'round';
    for (const o of [-11, 0, 11]) { c.beginPath(); c.moveTo(x + 38, y + o); c.lineTo(x + 100, y + o - 18); c.stroke(); }
    piece(c, '#f7fafc', ell(x, y, 23, 23));
    return;
  }
  const i = poseIdx(q, T_HIT);
  if (i < 0 || i > 3) return;
  const cx = B_X + 80, cy = GROUND - 445;
  if (i === 0) {   // 1 pose de "puf" achatado
    piece(c, '#f7fafc', poly(Array.from({ length: 16 }, (_, k) => { const a = k / 16 * TAU, r = k % 2 ? 40 : 74; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.8]; })));
    return;
  }
  const r = rng(11);
  for (let k = 0; k < 9; k++) {
    const a = -Math.PI * (0.1 + r() * 0.8) + (r() < 0.3 ? Math.PI * 0.5 : 0), d = (40 + r() * 50) * i;
    piece(c, '#f7fafc', ell(cx + Math.cos(a) * d, cy + Math.sin(a) * d + 18 * i * i, 8 + r() * 6, 7 + r() * 5), { shadow: false, lw: 2.5 });
  }
}

// --------------------------------- CÂMARA ----------------------------------
// Plano geral -> grande plano de quem fala -> plano geral. Cortes secos.
function camera(t) {
  let s = 1, fx = W / 2, fy = H / 2, sx = 0, sy = 0;
  if (between(t, T_SHOT2, T_SHOT3)) { s = 2.4; fx = 1325; fy = GROUND - 305 * KS; }
  const i = poseIdx(twos(t), T_HIT);                       // tremor: 2 poses, ±5px
  if (i === 0) { sx = 6; sy = -5; } else if (i === 1) { sx = -5; sy = 4; }
  return { s, fx, fy, sx, sy };
}
function applyCam(c, cam, depth) {
  // depth: 0 = muito longe (quase não escala), 1 = plano das personagens
  const s = 1 + (cam.s - 1) * depth;
  c.setTransform(s, 0, 0, s, W / 2 - cam.fx * s + cam.sx, H / 2 - cam.fy * s + cam.sy);
}

function caption(c, t) {
  let text = null;
  if (between(t, T_A_TALK, T_SHOT2)) text = 'Ei! Hoje não há aulas!';
  else if (between(t, T_B_TALK, T_SHOT3)) text = 'A sério?! Brutal!';
  else if (t >= T_LAUGH) text = 'HA HA HA HA!';
  if (!text) return;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.font = '700 46px Inter, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.letterSpacing = '0.5px'; c.wordSpacing = '8px';
  c.lineJoin = 'round'; c.lineWidth = 7; c.strokeStyle = '#000'; c.strokeText(text, W / 2, 1032);
  c.fillStyle = '#fff'; c.fillText(text, W / 2, 1032);
}

function renderFrame(t) {
  const cam = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#79b5e4'; ctx.fillRect(0, 0, W, H);
  applyCam(ctx, cam, 0.5); ctx.drawImage(FAR, 0, 0);
  applyCam(ctx, cam, 0.75); ctx.drawImage(MID, 0, 0);
  applyCam(ctx, cam, 1); ctx.drawImage(NEAR, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0); snow(ctx, t, false);
  applyCam(ctx, cam, 1); CAM_S = cam.s;
  drawKid(ctx, KID_A, stateA(t));
  drawKid(ctx, KID_B, stateB(t));
  snowball(ctx, t);
  CAM_S = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); snow(ctx, t, true);
  caption(ctx, t);
}

buildBackground();
window.renderFrame = renderFrame;
window.ready = true;

if (!location.search.includes('render')) {
  const t0 = performance.now();
  (function loop(now) {
    renderFrame(Math.floor(((now - t0) / 1000) % DURATION * FPS) / FPS);
    requestAnimationFrame(loop);
  })(t0);
}
</script>
