    }
    if (lt < c2) {

      const hit = s(3) + 1.0, q = lt - hit;
      heart.update(t, { ph: q < 0 ? phaseAt(lt) : null, dent: q > 0 ? Math.exp(-q * 4) * ss(0, .05, q) : 0, chaos: ss(s(4) + 1.4, s(4) + 2.5, lt) * .6, flash: q > 0 ? Math.exp(-q * 8) * .5 : 0, cam: HCAM(lt, { dist: 6.8, az: .15, spin: .03, el: .05, shift: -330 }) });
      post(t, { right: .9 });

      tag('STRETCH-ACTIVATED CHANNELS OPEN', 1150, 290, ss(s(3) + 1.3, s(3) + 1.8, lt), RED);

  /* ---------- 4 · THE IMPACT ---------- */
  impact(lt, sc, t) {

  /* ---------- 5 · THE CLOCK ---------- */
  aed(lt, sc, t) {
    const s = sc.S, c1 = s(5) - .05, shock = s(5) + 2.6;

    const fl = lt >= shock ? Math.exp(-(lt - shock) * 3) : 0, [p0x, p0y] = figAt(defibPoint('pad0'), zf), [p1x, p1y] = figAt(defibPoint('pad1'), zf), [bx, by] = figAt(defibPoint('btn'), zf);

    glowAt(bx, by, 70, 'rgba(255,74,85,.8)', lt < shock ? ss(shock - .6, shock - .2, lt) * (.6 + .4 * Math.sin(lt * 14)) : 0);

    tag('DEFIBRILLATOR', 1180, 330, ss(c1 + .3, c1 + .8, lt), CYAN);
    const J = Math.round(200 * (lt < shock ? ss(c1 + .3, shock - .2, lt) : Math.max(0, 1 - (lt - shock) / .12)));

/* ============================== FRAME ============================== */
async function renderFrame(t) {
  t = clamp(t, 0, TOTAL - 1e-4);
  let sc = SC[0]; for (const s of SC) if (t >= s.start) sc = s;
  const lt = t - sc.start;
  const plan = FIGPLAN[sc.id] && FIGPLAN[sc.id](lt, sc); FIG = plan ? await loadFig(plan) : null;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const res = SCENES[sc.id](lt, sc, t) || {};
  captions(sc, lt, res.capOff ? 0 : (res.capK ?? 1));
  chapterCard(sc, lt);
  // camera FX on the 3D layer: whip-pan at every cut, punch-in on emphasised words, impact shake
  let whip = 0, dir = 1, tr = 0, trDur = .16;
  for (const [i, c] of (res.cuts || []).entries()) {
    const ty = (res.hard || []).includes(c) ? 0 : (Math.round(c * 37) + sc.idx * 3 + i) % 6, D = ty === 2 ? .3 : (ty === 5 ? .35 : .16), d = lt - c;
    if (Math.abs(d) < D) { const k = 1 - Math.abs(d) / D; if (k * k > whip) { whip = k * k; tr = ty; trDur = D; dir = (i % 2 ? -1 : 1) * Math.sign(d || 1); } }
  }
  // transition styles (no flashes): 0 hard cut · 1 horizontal whip · 2 zoom-through · 3 vertical whip · 4 roll-whip · 5 focus pull
  let tx = 0, ty2 = 0, tz = 0, trot = 0, tblur = 0;
  if (tr === 1) { tx = dir * whip * 240; tblur = whip * 16; }
  else if (tr === 2) { tz = whip * .35; tblur = whip * 8; }
  else if (tr === 3) { ty2 = dir * whip * 160; tblur = whip * 14; }
  else if (tr === 4) { trot = dir * whip * 7; tz = whip * .12; tblur = whip * 10; }
  else if (tr === 5) { tblur = whip * 18; tz = whip * .04; }
  let punch = 0; for (const p of PUNCH) { const d = t - p; if (d >= 0 && d < 1) punch = Math.max(punch, Math.exp(-d * 5) * ss(0, .04, d)); }
  const fl = flashAt(t).f * (res.flash !== undefined ? 1 : 0);
  const shx = 0, shy = 0;
  // never a static frame: every shot drifts in, and long shots get jump-zooms every ~2.6 s
  const cutsAll = [0, ...(res.cuts || []).filter(c => c > 0 && c < sc.dur), sc.dur].sort((a, b) => a - b);
  let s0 = 0, s1 = sc.dur; for (let i = 0; i + 1 < cutsAll.length; i++) if (lt >= cutsAll[i] && lt < cutsAll[i + 1]) { s0 = cutsAll[i]; s1 = cutsAll[i + 1]; }
  const sl = s1 - s0, u = clamp((lt - s0) / sl), shotN = cutsAll.indexOf(s0) + sc.idx * 7;
  const drift = 1.015 + .075 * u;
  let jz = 0, jx = 0, jy = 0;
  if (false) {
    const n = Math.max(2, Math.round(sl / 2.6)), seg2 = sl / n, k = Math.min(n - 1, Math.floor((lt - s0) / seg2)), into = lt - s0 - k * seg2;
    const lvl = kk => (kk % 2) * .14 + (kk % 3 === 2 ? .06 : 0);
    const e = ss(0, .14, into); jz = lerp(lvl(k - 1 < 0 ? 0 : k - 1), lvl(k), k ? e : 1);
    const side = ((shotN + k) % 3 - 1); jx = side * 70 * jz / .14; jy = -20 * jz / .14;
    if (k) CUTS_ABS.add(+(sc.start + s0 + k * seg2).toFixed(3));
  }
  (res.cuts || []).forEach(c => { if (c > 0 && c < sc.dur) CUTS_ABS.add(+(sc.start + c).toFixed(3)); }); CUTS_ABS.add(+sc.start.toFixed(3));
  const Z = drift * (1 + jz) * (1 + punch * .05 + tz);
  GL.style.transform = `translate(${(tx + shx - jx).toFixed(1)}px,${(ty2 + shy - jy).toFixed(1)}px) rotate(${trot.toFixed(2)}deg) scale(${(Z * (1 + Math.abs(trot) * .012)).toFixed(4)})`;
  GL.style.filter = `contrast(1.14) saturate(1.18) brightness(.97) blur(${tblur.toFixed(1)}px)`;
  let black = 0;
  const edge = Math.min(lt, sc.dur - lt); black = Math.max(black, (1 - clamp(edge / .1)) * .8);
  if (res.fadeIn) black = Math.max(black, 1 - clamp(lt / res.fadeIn));
  if (res.fadeOut) black = Math.max(black, ss(sc.dur - res.fadeOut, sc.dur, lt));
  if (black > 0) { g.fillStyle = `rgba(0,0,0,${black})`; g.fillRect(0, 0, W, H); }
  letterbox();
}
// chapter progress bar inside the top letterbox: viewers always see where they are and what's next
const CUTS_ABS = new Set(); window.CUTS_ABS = CUTS_ABS;
function progressBar(t) {
  const h = SC[0]; if (t < h.start + h.dur - .3) return;
  const a = ss(h.dur - .3, h.dur + .6, t) * (1 - ss(TOTAL - 4, TOTAL - 2, t)); if (a <= 0) return;
  const x0 = 150, x1 = W - 150, y = 92, chs = SC.filter(s => s.chapter);
  const T0 = chs[0].start, T1 = TOTAL; const X = v => x0 + (x1 - x0) * (v - T0) / (T1 - T0);
  g.save(); g.globalAlpha = a;
  chs.forEach((s, i) => {
    const xa = X(s.start) + (i ? 6 : 0), xb = X(s.start + s.dur) - 6, cur = t >= s.start && t < s.start + s.dur, done = t >= s.start + s.dur;
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(xa, y, xb - xa, 4);
    const fillTo = done ? xb : (cur ? lerp(xa, xb, (t - s.start) / s.dur) : xa);
    if (fillTo > xa) { g.fillStyle = cur ? AMBER : 'rgba(111,216,255,.55)'; if (cur) { g.shadowColor = AMBER; g.shadowBlur = (10) * DPR; } g.fillRect(xa, y, fillTo - xa, 4); g.shadowBlur = 0; }
    g.font = `${cur ? 700 : 500} 13px Inter`; g.letterSpacing = '2px'; g.fillStyle = cur ? '#fff' : 'rgba(255,255,255,.45)'; g.textAlign = 'left';
    g.fillText(`${s.numeral}  ${s.chapter.toUpperCase()}`, xa, y - 14);

}
