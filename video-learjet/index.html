<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Learjet 60 — A física da queda</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#04060b}
  canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<canvas id="ov" width="1920" height="1080"></canvas>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';

/* =====================================================================
   UTILITIES
   ===================================================================== */
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const seg = (x, a, b) => clamp((x - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const wrap = (v, a, b) => a + ((((v - a) % (b - a)) + (b - a)) % (b - a));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmtd = (n, d) => n.toFixed(d).replace('.', ',');
// fade in at a, out at b
const win = (lt, a, b, fi = .45, fo = .45) => ss(a, a + fi, lt) * (1 - ss(b - fo, b, lt));

const AMBER = '#FFB547', CYAN = '#5CD6FF', RED = '#FF4D5E', GREEN = '#59F0A0';

/* =====================================================================
   RENDERER + 2D OVERLAY
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const g = document.getElementById('ov').getContext('2d');

function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function T(str, x, y, o = {}) {
  if ((o.a ?? 1) <= 0.001) return 0;
  g.save(); g.globalAlpha = clamp(o.a ?? 1);
  g.font = `${o.it ? 'italic ' : ''}${o.w || 600} ${o.s || 40}px Inter, "Inter Display", sans-serif`;
  g.fillStyle = o.c || '#fff'; g.textAlign = o.al || 'left'; g.textBaseline = o.bl || 'alphabetic';
  g.letterSpacing = (o.ls || 0) + 'px';
  if (o.sh !== false) { g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = o.sb ?? 16; }
  g.fillText(str, x, y); const w = g.measureText(str).width; g.restore(); return w;
}
function P(x, y, w, h, a = 1, o = {}) {
  if (a <= 0.001) return;
  g.save(); g.globalAlpha = clamp(a);
  g.fillStyle = o.bg || 'rgba(7,12,22,0.74)'; rr(x, y, w, h, o.r ?? 16); g.fill();
  g.strokeStyle = o.bc || 'rgba(255,255,255,0.13)'; g.lineWidth = o.lw || 1.5; g.stroke();
  if (o.accent) { g.fillStyle = o.accent; rr(x, y, 6, h, 3); g.fill(); }
  g.restore();
}
function line(pts, o = {}) {
  g.save(); g.globalAlpha = o.a ?? 1; g.strokeStyle = o.c || '#fff'; g.lineWidth = o.lw || 2;
  g.lineCap = 'round'; g.lineJoin = 'round'; if (o.dash) g.setLineDash(o.dash);
  if (o.glow) { g.shadowColor = o.c; g.shadowBlur = o.glow; }
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.restore();
}
function arrow(x1, y1, x2, y2, o = {}) {
  const a = Math.atan2(y2 - y1, x2 - x1), hs = o.hs || 18;
  line([[x1, y1], [x2, y2]], o);
  g.save(); g.globalAlpha = o.a ?? 1; g.fillStyle = o.c || '#fff';
  if (o.glow) { g.shadowColor = o.c; g.shadowBlur = o.glow; }
  g.beginPath(); g.moveTo(x2 + Math.cos(a) * 4, y2 + Math.sin(a) * 4);
  g.lineTo(x2 - Math.cos(a - .45) * hs, y2 - Math.sin(a - .45) * hs);
  g.lineTo(x2 - Math.cos(a + .45) * hs, y2 - Math.sin(a + .45) * hs); g.closePath(); g.fill(); g.restore();
}
function proj(v, cam) { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; }

/* shared textures */
function cloudTex(seed) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const r = rng(seed);
  for (let i = 0; i < 42; i++) {
    const a = r() * Math.PI * 2, d = r() * 62, px = 128 + Math.cos(a) * d, py = 128 + Math.sin(a) * d * .75, rad = 26 + r() * 40;
    const gr = x.createRadialGradient(px, py, 0, px, py, rad);
    gr.addColorStop(0, 'rgba(255,255,255,0.20)'); gr.addColorStop(.6, 'rgba(255,255,255,0.08)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.beginPath(); x.arc(px, py, rad, 0, 7); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const CLOUD_TEX = [cloudTex(3), cloudTex(17), cloudTex(91)];
function dotTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const DOT_TEX = dotTex();

/* =====================================================================
   JET MODEL (procedural, generic swept-wing T-tail business jet)
   ===================================================================== */
function makeJet() {
  const grp = new THREE.Group();
  const white = new THREE.MeshStandardMaterial({ color: 0xeef1f5, metalness: .35, roughness: .32 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x0f1724, metalness: .7, roughness: .2 });
  const accent = new THREE.MeshStandardMaterial({ color: 0x1e3f73, metalness: .4, roughness: .4 });
  const prof = [[0.06, 0], [0.32, 0.4], [0.58, 1.6], [0.8, 3.6], [0.87, 5.6], [0.88, 10.4], [0.82, 12.2], [0.64, 13.6], [0.4, 14.7], [0.16, 15.32], [0.0, 15.5]]
    .map(p => new THREE.Vector2(p[0], p[1]));
  const fg = new THREE.LatheGeometry(new THREE.SplineCurve(prof).getPoints(70), 40);
  fg.rotateZ(-Math.PI / 2); fg.translate(-7.75, 0, 0);
  grp.add(new THREE.Mesh(fg, white));
  // windshield
  const ws = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12), dark); ws.scale.set(1.25, .36, .66); ws.position.set(5.15, .46, 0); grp.add(ws);
  // cabin windows
  for (let i = 0; i < 6; i++) for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(.42, .3, .06), dark); w.position.set(2.6 - i * 1.05, .28, s * .86); grp.add(w);
  }
  // cheat line
  const cl = new THREE.Mesh(new THREE.CylinderGeometry(.885, .885, 11, 40, 1, true), accent);
  cl.rotation.z = Math.PI / 2; cl.position.set(-0.5, 0, 0); cl.scale.set(1, 1, 1);
  const clMask = new THREE.Mesh(new THREE.BoxGeometry(11.2, .12, 2), accent); clMask.position.set(-0.5, -.05, 0);
  // simple stripe: a thin box hugging sides
  for (const s of [-1, 1]) { const st = new THREE.Mesh(new THREE.BoxGeometry(12.5, .1, .02), accent); st.position.set(-.8, -.05, s * .875); grp.add(st); }
  // wings
  const wsh = new THREE.Shape(); wsh.moveTo(1.7, .5); wsh.lineTo(-1.15, 6.7); wsh.lineTo(-2.35, 6.7); wsh.lineTo(-2.3, .5); wsh.closePath();
  const wg = new THREE.ExtrudeGeometry(wsh, { depth: .16, bevelEnabled: true, bevelThickness: .07, bevelSize: .07, bevelSegments: 2 });
  wg.rotateX(Math.PI / 2);
  const winglet = new THREE.Shape(); winglet.moveTo(-1.15, 0); winglet.lineTo(-2.35, 0); winglet.lineTo(-2.75, 1.1); winglet.lineTo(-2.15, 1.1); winglet.closePath();
  const wlg = new THREE.ExtrudeGeometry(winglet, { depth: .07, bevelEnabled: false });
  for (const s of [1, -1]) {
    const w = new THREE.Mesh(wg, white); w.position.y = -.42; w.scale.z = s; w.rotation.x = -.055 * s; grp.add(w);
    const wl = new THREE.Mesh(wlg, accent); wl.position.set(0, -.12, s * 6.72 - .035); grp.add(wl);
  }
  // engines
  for (const s of [1, -1]) {
    const e = new THREE.Mesh(new THREE.CylinderGeometry(.52, .44, 3.3, 28), white); e.rotation.z = Math.PI / 2; e.position.set(-4.7, .58, s * 1.55); grp.add(e);
    const ei = new THREE.Mesh(new THREE.CylinderGeometry(.44, .44, .1, 28), dark); ei.rotation.z = Math.PI / 2; ei.position.set(-3.03, .58, s * 1.55); grp.add(ei);
    const eb = new THREE.Mesh(new THREE.TorusGeometry(.5, .06, 8, 28), accent); eb.rotation.y = Math.PI / 2; eb.position.set(-3.1, .58, s * 1.55); grp.add(eb);
    const py = new THREE.Mesh(new THREE.BoxGeometry(1.5, .16, .9), white); py.position.set(-4.8, .55, s * 1.0); grp.add(py);
  }
  // vertical tail
  const vt = new THREE.Shape(); vt.moveTo(-5.2, .5); vt.lineTo(-7.15, 3.75); vt.lineTo(-8.55, 3.75); vt.lineTo(-7.95, .5); vt.closePath();
  const vtg = new THREE.ExtrudeGeometry(vt, { depth: .16, bevelEnabled: true, bevelThickness: .04, bevelSize: .04, bevelSegments: 1 }); vtg.translate(0, 0, -.08);
  grp.add(new THREE.Mesh(vtg, accent));
  // horizontal T-tail
  const ht = new THREE.Shape(); ht.moveTo(-7.05, 0); ht.lineTo(-8.1, 2.8); ht.lineTo(-8.85, 2.8); ht.lineTo(-8.45, 0); ht.closePath();
  const htg = new THREE.ExtrudeGeometry(ht, { depth: .1, bevelEnabled: true, bevelThickness: .03, bevelSize: .03, bevelSegments: 1 }); htg.rotateX(Math.PI / 2);
  for (const s of [1, -1]) { const m = new THREE.Mesh(htg, white); m.position.y = 3.82; m.scale.z = s; grp.add(m); }
  // lights: glow sprites
  const mkGlow = (col, size) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: DOT_TEX, color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); sp.scale.set(size, size, 1); grp.add(sp); return sp; };
  const red = mkGlow(0xff3030, 1.6); red.position.set(-1.6, -.1, -6.75);
  const grn = mkGlow(0x30ff70, 1.6); grn.position.set(-1.6, -.1, 6.75);
  const st1 = mkGlow(0xffffff, 3); st1.position.set(-2.4, -.1, -6.8);
  const st2 = mkGlow(0xffffff, 3); st2.position.set(-2.4, -.1, 6.8);
  const bcn = mkGlow(0xff2020, 1.8); bcn.position.set(-2, .95, 0);
  const lights = { red, grn, st1, st2, bcn };
  function blink(t, k = 1) {
    const s = (t % 1.25) < .07 ? 1 : 0; st1.material.opacity = st2.material.opacity = s * k;
    bcn.material.opacity = (0.5 + .5 * Math.sin(t * 6.5)) * k; red.material.opacity = grn.material.opacity = .9 * k;
  }
  return { group: grp, lights, blink, mats: { white, accent } };
}

/* =====================================================================
   WORLD: STORM (chase camera inside convective cloud)
   ===================================================================== */
function makeStorm() {
  const scene = new THREE.Scene();
  const fogC = new THREE.Color(0x1f2835), flashC = new THREE.Color(0x9eb2d6);
  scene.background = fogC.clone(); scene.fog = new THREE.FogExp2(fogC.clone(), 0.0042);
  const hemi = new THREE.HemisphereLight(0xa8bad4, 0x161b24, 1.5); scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xd6deea, 1.4); dir.position.set(30, 80, 30); scene.add(dir);
  const flashL = new THREE.DirectionalLight(0xe2ebff, 0); flashL.position.set(-40, 60, -80); scene.add(flashL);
  const jet = makeJet(); scene.add(jet.group); jet.group.rotation.order = 'YZX';
  const cam = new THREE.PerspectiveCamera(42, W / H, .5, 4000);
  const r = rng(7), clouds = [];
  const B = { x: 380, y: 200, z: 280 };
  for (let i = 0; i < 230; i++) {
    const shade = .32 + r() * .32;
    const col = new THREE.Color(shade * .92, shade * .97, shade * 1.06);
    const m = new THREE.SpriteMaterial({ map: CLOUD_TEX[i % 3], color: col.clone(), transparent: true, opacity: .55 + r() * .4, depthWrite: false });
    const s = new THREE.Sprite(m); const sc = 70 + r() * 130; s.scale.set(sc, sc * .8, 1);
    s.userData = { base: new THREE.Vector3((r() * 2 - 1) * B.x, (r() * 2 - 1) * B.y, (r() * 2 - 1) * B.z), col, op: m.opacity };
    scene.add(s); clouds.push(s);
  }
  // rain streaks
  const NR = 2600, rp = new Float32Array(NR * 6), rbase = [];
  for (let i = 0; i < NR; i++) rbase.push(new THREE.Vector3((r() * 2 - 1) * 70, (r() * 2 - 1) * 45, (r() * 2 - 1) * 55));
  const rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.BufferAttribute(rp, 3));
  const rain = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0xa9bad2, transparent: true, opacity: .32, depthWrite: false }));
  scene.add(rain);
  const off = new THREE.Vector3(), roff = new THREE.Vector3(); let lastT = null;
  const tmp = new THREE.Vector3();
  function update(t, o) {
    const dt = lastT === null ? 0 : clamp(t - lastT, 0, .1); lastT = t;
    const tb = o.turb || 0;
    const n1 = Math.sin(t * 6.3) * .5 + Math.sin(t * 11.7 + 1.3) * .3 + Math.sin(t * 2.1 + .4) * .7;
    const n2 = Math.sin(t * 5.1 + 2) * .5 + Math.sin(t * 9.3) * .4 + Math.sin(t * 1.7) * .4;
    const pitch = o.pitch || 0, roll = o.roll || 0;
    jet.group.position.set(0, tb * n1 * 1.4, 0);
    jet.group.rotation.set(roll + tb * n2 * .07, 0, pitch + tb * n1 * .035);
    jet.blink(t);
    const fwd = new THREE.Vector3(Math.cos(pitch), Math.sin(pitch), 0);
    const flow = fwd.clone().multiplyScalar(-(o.speed ?? 140));
    off.addScaledVector(flow, dt);
    roff.addScaledVector(flow, dt * 1.25).add(tmp.set(0, -38 * dt, 0));
    const fl = o.flash || 0;
    // camera
    const c = o.cam || { dist: 32, az: 2.7, el: .12 };
    const sh = tb * .35;
    cam.position.set(c.dist * Math.cos(c.el) * Math.cos(c.az), c.dist * Math.sin(c.el), c.dist * Math.cos(c.el) * Math.sin(c.az))
      .add(tmp.set(Math.sin(t * 17) * sh, Math.sin(t * 13 + 1) * sh, Math.sin(t * 19 + 2) * sh));
    cam.fov = c.fov || 42; if (c.shift) cam.setViewOffset(W, H, -c.shift, c.shiftY || 0, W, H); else cam.clearViewOffset(); cam.updateProjectionMatrix();
    cam.lookAt(fwd.clone().multiplyScalar(c.lead ?? 4).add(jet.group.position.clone().multiplyScalar(.6)));
    for (const s of clouds) {
      const b = s.userData.base;
      s.position.set(wrap(b.x + off.x, -B.x, B.x), wrap(b.y + off.y, -B.y, B.y), wrap(b.z + off.z, -B.z, B.z));
      const d = s.position.distanceTo(cam.position);
      s.material.opacity = s.userData.op * ss(12, 70, d) * (o.cloudK ?? 1);
      s.material.color.copy(s.userData.col).multiplyScalar(1 + fl * 1.9);
    }
    // rain
    const rd = flow.clone().add(tmp.set(0, -38, 0)).normalize().multiplyScalar(2.5 + (o.speed ?? 140) * .025);
    for (let i = 0; i < NR; i++) {
      const b = rbase[i];
      const x = wrap(b.x + roff.x, -70, 70), y = wrap(b.y + roff.y, -45, 45), z = wrap(b.z + roff.z, -55, 55);
      rp.set([x, y, z, x + rd.x, y + rd.y, z + rd.z], i * 6);
    }
    rg.attributes.position.needsUpdate = true;
    rain.material.opacity = .3 * (o.rainK ?? 1);
    scene.background.copy(fogC).lerp(flashC, fl * .55); scene.fog.color.copy(scene.background);
    flashL.intensity = fl * 5;
    hemi.intensity = 1.5 * (o.dark ?? 1);
    renderer.render(scene, cam);
  }
  return { scene, cam, jet, update };
}

/* =====================================================================
   WORLD: CLEAR SKY above cloud deck (day / dusk)
   ===================================================================== */
function makeSky() {
  const scene = new THREE.Scene();
  const U = { top: { value: new THREE.Vector3() }, hor: { value: new THREE.Vector3() }, bot: { value: new THREE.Vector3() } };
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: U,
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `uniform vec3 top,hor,bot; varying vec3 vP; void main(){ float h=vP.y; vec3 c = h>0.0 ? mix(hor,top,pow(clamp(h,0.,1.),0.55)) : mix(hor,bot,pow(clamp(-h,0.,1.),0.35)); gl_FragColor=vec4(c,1.0);} `
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), skyMat); scene.add(sky);
  scene.fog = new THREE.Fog(0xffffff, 250, 900);
  const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x8a7c70, 1.6); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d8, 3.0); sun.position.set(60, 50, 80); scene.add(sun);
  const jet = makeJet(); scene.add(jet.group);
  const cam = new THREE.PerspectiveCamera(38, W / H, .5, 6000);
  const r = rng(21), clouds = [];
  for (let i = 0; i < 260; i++) {
    const m = new THREE.SpriteMaterial({ map: CLOUD_TEX[i % 3], color: 0xffffff, transparent: true, opacity: .95, depthWrite: false });
    const s = new THREE.Sprite(m); const sc = 120 + r() * 200; s.scale.set(sc, sc * .55, 1);
    s.userData.base = new THREE.Vector3((r() * 2 - 1) * 700, -95 - r() * 40, (r() * 2 - 1) * 500); scene.add(s); clouds.push(s);
  }
  const off = new THREE.Vector3(); let lastT = null;
  const presets = {
    day: { top: [.13, .32, .66], hor: [.78, .86, .95], bot: [.62, .68, .76], cloud: [1, 1, 1], sun: [1, .95, .86], fog: [.78, .86, .95] },
    dusk: { top: [.04, .07, .18], hor: [.95, .52, .32], bot: [.32, .25, .32], cloud: [.95, .7, .62], sun: [1, .62, .4], fog: [.7, .45, .38] },
    night: { top: [.01, .015, .04], hor: [.08, .1, .18], bot: [.04, .05, .08], cloud: [.25, .28, .36], sun: [.4, .5, .8], fog: [.08, .1, .16] },
  };
  function update(t, o) {
    const dt = lastT === null ? 0 : clamp(t - lastT, 0, .1); lastT = t;
    const p = presets[o.mode || 'day'];
    U.top.value.set(...p.top); U.hor.value.set(...p.hor); U.bot.value.set(...p.bot);
    scene.fog.color.setRGB(...p.fog, THREE.SRGBColorSpace);
    sun.color.setRGB(...p.sun, THREE.SRGBColorSpace); sun.intensity = o.mode === 'night' ? .6 : 3;
    hemi.intensity = o.mode === 'night' ? .4 : 1.6;
    off.x -= (o.speed ?? 90) * dt;
    for (const s of clouds) {
      const b = s.userData.base; s.position.set(wrap(b.x + off.x, -700, 700), b.y, b.z);
      s.material.color.setRGB(...p.cloud, THREE.SRGBColorSpace);
    }
    jet.group.position.set(0, Math.sin(t * .7) * .4, 0);
    jet.group.rotation.set(Math.sin(t * .5) * .03, 0, Math.sin(t * .6) * .015 + (o.pitch || 0));
    jet.blink(t, o.mode === 'night' ? 1 : .5);
    const c = o.cam;
    cam.position.set(c.dist * Math.cos(c.el) * Math.cos(c.az), c.dist * Math.sin(c.el), c.dist * Math.cos(c.el) * Math.sin(c.az));
    if (c.off) cam.position.add(c.off);
    cam.fov = c.fov || 38; if (c.shift || c.shiftY) cam.setViewOffset(W, H, -(c.shift || 0), c.shiftY || 0, W, H); else cam.clearViewOffset(); cam.updateProjectionMatrix();
    jet.group.visible = o.hideJet ? false : true;
    cam.lookAt(c.look || new THREE.Vector3(0, 0, 0));
    renderer.render(scene, cam);
  }
  return { scene, cam, jet, update };
}

/* =====================================================================
   WORLD: MAP (Gulf of Mexico / Florida / Bahamas)
   ===================================================================== */
function makeMap() {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050b14);
  scene.fog = new THREE.Fog(0x050b14, 18, 45);
  scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x05080f, 1.4));
  const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(-5, 10, 6); scene.add(dl);
  const ll = (lon, lat, y = 0) => new THREE.Vector3((lon + 86), y, -(lat - 27));
  const ocean = new THREE.Mesh(new THREE.PlaneGeometry(120, 80), new THREE.MeshStandardMaterial({ color: 0x07182b, roughness: .9 }));
  ocean.rotation.x = -Math.PI / 2; ocean.position.y = -.02; scene.add(ocean);
  // graticule

const DATA = await (await fetch('script.json')).json();

function setup(timings) {
  SC = []; TOTAL = 0;
  DATA.scenes.forEach((s, i) => {
    const sents = s.text.split(/(?<=[.!?])\s+/);
    let st = [], speech;
    const tm = timings && timings.scenes && timings.scenes[i];
    if (tm && tm.sentence_starts && tm.sentence_starts.length === sents.length) { st = tm.sentence_starts.map(v => LEAD + v); speech = tm.duration; }
    else { let c = 0; sents.forEach(x => { st.push(LEAD + c / CPS); c += x.length + 1; }); speech = s.text.length / CPS; }

}

  /* ---------------- 07 DIVE / OVERSPEED ---------------- */
  dive(lt, sc, t) {
    const fl = flashAt(t);
    const sw1 = sc.S(4) - .1, sw2 = sc.S(7) - .1;

    } else if (lt < sw2) {
      const shockX = lerp(-.25, .75, eio(seg(lt, sc.S(5), sc.S(5) + 3.5)));
      const stress = ss(sc.S(6) + 1.5, sc.S(6) + 5, lt);

        T(ti, x, y - 44, { s: 36, w: 800, al: 'center', c, a: k }); T(sub, x, y + 60, { s: 26, w: 500, al: 'center', a: k });
      });

      g.restore();

      const dp = eio(seg(lt, sw1 + 2, sw2 - .5)); const cut = Math.max(2, Math.floor(det.length * dp));
      line(det.slice(0, cut), { c: GREEN, lw: 5, a: pa, glow: 12 });
      const hp = det[cut - 1], hp0 = det[cut - 2]; const ang = Math.atan2(hp[1] - hp0[1], hp[0] - hp0[0]);
      g.save(); g.globalAlpha = pa; g.translate(hp[0], hp[1]); g.rotate(ang); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(22, 0); g.lineTo(-14, -14); g.lineTo(-6, 0); g.lineTo(-14, 14); g.closePath(); g.fill(); g.restore();
      T('CONTORNAR, NUNCA ATRAVESSAR', W / 2, 150, { s: 54, w: 900, ls: 3, al: 'center', a });
      T('Margem recomendada a células de trovoada intensas', W / 2, 205, { s: 26, w: 500, al: 'center', c: 'rgba(255,255,255,.75)', a });
      const fa = win(lt, sc.S(4), sc.dur + 1, .6, .1);

};

/* =====================================================================
   FRAME
   ===================================================================== */
function renderFrame(t) {
  t = clamp(t, 0, TOTAL - 1e-4);
  let sc = SC[0]; for (const s of SC) if (t >= s.start) sc = s;
  const lt = t - sc.start;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1;
  BLACK = 0;
  const res = SCENES[sc.id](lt, sc, t) || {};
  chapterTag(sc, lt);
  if (res.flash) { g.fillStyle = `rgba(220,232,255,${res.flash * .16})`; g.fillRect(0, 0, W, H); }
  progressBar(t);
  // scene cross-dips
  const edge = Math.min(lt, sc.dur - lt);
  if (sc.idx > 0 || lt > .1) BLACK = Math.max(BLACK, 1 - clamp(edge / .3));
  if (sc.idx === 0) BLACK = Math.max(BLACK, 1 - clamp(lt / .8));
  if (BLACK > 0) { g.fillStyle = `rgba(0,0,0,${BLACK})`; g.fillRect(0, 0, W, H); }
}

window.setupTimeline = setup;
window.renderFrame = renderFrame;
window.TIMELINE = setup(null);
